name: Publish

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'Optional OpenWrt override. Leave empty to resolve the latest release and snapshot automatically.'
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    if: ${{ github.event_name != 'schedule' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/development' }}
    name: Resolve OpenWrt versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.resolve.outputs.versions }}
    steps:
      - name: Resolve latest release and snapshot
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import re
          import urllib.request

          def fetch_json(url):
              req = urllib.request.Request(url, headers={"Accept": "application/vnd.github+json", "User-Agent": "usteer-ng-workflow"})
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)

          override = os.environ.get("INPUT_OPENWRT_VERSION", "")
          if override:
              release_version = override
              match = re.match(r"^(\d+)\.(\d+)(?:\.(\d+))?", override)
              if match:
                  snapshot_version = f"{match.group(1)}.{match.group(2)}-SNAPSHOT"
              else:
                  snapshot_version = override
          else:
              release_info = fetch_json("https://api.github.com/repos/openwrt/openwrt/releases/latest")
              tag_name = release_info["tag_name"]
              match = re.match(r"^v?(\d+)\.(\d+)(?:\.(\d+))?", tag_name)
              if not match:
                  raise SystemExit(f"Unable to parse OpenWrt release tag: {tag_name}")
              release_version = f"{match.group(1)}.{match.group(2)}" if match.group(3) is None else f"{match.group(1)}.{match.group(2)}.{match.group(3)}"
              snapshot_version = f"{match.group(1)}.{match.group(2)}-SNAPSHOT"

          versions = [snapshot_version]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"versions={json.dumps(versions)}\n")

          print(f"Resolved release={release_version} snapshot={snapshot_version}")
          PY
        env:
          INPUT_OPENWRT_VERSION: ${{ github.event.inputs.openwrt_version }}

  build:
    if: ${{ github.event_name != 'schedule' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/development' }}
    name: ${{ matrix.arch }} / ${{ matrix.version }} build
    needs: prepare
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        arch:
          - aarch64_cortex-a53
        version: ${{ fromJSON(needs.prepare.outputs.versions) }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build
        uses: cmangla/gh-action-sdk@pr-hash-fixup-option
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.version }}
          V: sc
          PACKAGES: usteer-ng
          FIXUP: 1

      - name: List outputs
        run: |
          find bin/packages
          
          # Renaming APK files to include architecture suffix
          # e.g., librespot_0.8.0-r1.apk -> librespot_0.8.0-r1_aarch64_cortex-a53.apk
          if ls bin/packages/${{ matrix.arch }}/action/*.apk 1> /dev/null 2>&1; then
            echo "Processing APK files..."
            for apk_file in bin/packages/${{ matrix.arch }}/action/*.apk; do
              filename=$(basename "$apk_file")
              new_filename="${filename%.apk}_${{ matrix.arch }}.apk"
              mv bin/packages/${{ matrix.arch }}/action/"$filename" bin/packages/${{ matrix.arch }}/action/"$new_filename"
            done
          else
            echo "No APK files found"
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: ls-${{ matrix.arch }}-${{ matrix.version }}
          retention-days: 14
          path: |
            bin/packages/${{ matrix.arch }}/action/*.ipk
            bin/packages/${{ matrix.arch }}/action/*.apk